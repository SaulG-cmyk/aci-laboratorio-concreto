<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="titulo">
  <title id="titulo">Secuencia del ensayo de contenido de aire volumétrico ASTM C173 con medidor Roll-A-Meter</title>
  <defs>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: #14304f; }
      .s { font-family: Arial, Helvetica, sans-serif; fill: #475569; }
      .n { font-family: Arial, Helvetica, sans-serif; fill: #0f766e; font-weight: bold; }
      .w { font-family: Arial, Helvetica, sans-serif; fill: #ffffff; font-weight: bold; }
      .lbl { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; font-size: 11.5px; }
    </style>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="flechaGris" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>
  <text class="t" x="30" y="38" font-size="22" font-weight="bold">Contenido de aire volumétrico — ASTM C173</text>
  <text class="s" x="30" y="62" font-size="13">Secuencia del medidor Roll-A-Meter: llenado, adición de líquidos, inversión y rodado, lectura de la escala</text>

  <!-- PASO 1 -->
  <rect x="24" y="86" width="412" height="238" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="52" cy="114" r="15" fill="#0f766e"/>
  <text class="w" x="48" y="119" font-size="14">1</text>
  <text class="t" x="78" y="119" font-size="14" font-weight="bold">Llenado en dos capas</text>

  <!-- cuenco -->
  <path d="M 120 180 L 120 286 A 80 14 0 0 0 280 286 L 280 180 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="2.5"/>
  <ellipse cx="200" cy="180" rx="80" ry="14" fill="#f1f5f9" stroke="#14304f" stroke-width="2.5"/>
  <path d="M 126 232 Q 200 244 274 232" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text class="s" x="150" y="214" font-size="11">2.ª capa</text>
  <text class="s" x="150" y="266" font-size="11">1.ª capa</text>

  <!-- varilla -->
  <rect x="222" y="120" width="9" height="140" rx="4" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <text class="lbl" x="238" y="150">varilla 16 mm</text>
  <text class="lbl" x="238" y="166">25 golpes/capa</text>

  <!-- mazo -->
  <rect x="310" y="196" width="22" height="54" rx="9" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <rect x="316" y="246" width="10" height="46" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <text class="lbl" x="300" y="312">mazo 600 g</text>

  <!-- PASO 2 -->
  <rect x="464" y="86" width="412" height="238" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="492" cy="114" r="15" fill="#0f766e"/>
  <text class="w" x="488" y="119" font-size="14">2</text>
  <text class="t" x="518" y="119" font-size="14" font-weight="bold">Agua y alcohol al 70 %</text>

  <!-- sección superior -->
  <path d="M 566 250 L 566 300 A 70 12 0 0 0 706 300 L 706 250 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="2.5"/>
  <ellipse cx="636" cy="250" rx="70" ry="12" fill="#f1f5f9" stroke="#14304f" stroke-width="2.5"/>
  <rect x="606" y="150" width="60" height="100" rx="6" fill="#e0f2fe" fill-opacity="0.75" stroke="#14304f" stroke-width="2.5"/>
  <text class="lbl" x="584" y="278">cuenco ≥2.0 L</text>

  <!-- agua -->
  <rect x="610" y="196" width="52" height="54" fill="#38bdf8" fill-opacity="0.55"/>
  <text class="lbl" x="676" y="218">agua ≥0.5 L</text>

  <!-- embudo -->
  <path d="M 596 138 L 676 138 L 646 168 L 626 168 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="626" y="168" width="20" height="24" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <!-- gotas -->
  <path d="M 636 176 q 6 10 0 14 q -6 -4 0 -14" fill="#0ea5e9"/>
  <text class="lbl" x="556" y="136">embudo</text>

  <!-- alcohol -->
  <rect x="736" y="186" width="44" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <rect x="748" y="172" width="20" height="16" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text class="lbl" x="728" y="270">alcohol 70 %</text>
  <text class="lbl" x="728" y="286">registrar volumen</text>

  <!-- PASO 3 -->
  <rect x="24" y="344" width="412" height="238" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="52" cy="372" r="15" fill="#0f766e"/>
  <text class="w" x="48" y="377" font-size="14">3</text>
  <text class="t" x="78" y="377" font-size="14" font-weight="bold">Invertir, agitar y rodar</text>

  <!-- medidor inclinado -->
  <g transform="rotate(-42 210 480)">
    <path d="M 154 450 L 154 520 A 56 10 0 0 0 266 520 L 266 450 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="2.5"/>
    <ellipse cx="210" cy="450" rx="56" ry="10" fill="#f1f5f9" stroke="#14304f" stroke-width="2.5"/>
    <rect x="188" y="380" width="44" height="72" rx="5" fill="#e0f2fe" stroke="#14304f" stroke-width="2.5"/>
    <rect x="192" y="410" width="36" height="42" fill="#38bdf8" fill-opacity="0.55"/>
  </g>
  <path d="M 300 470 A 70 70 0 1 1 286 400" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#flecha)"/>
  <text class="lbl" x="300" y="404">rodar ¼–½ vuelta</text>
  <text class="lbl" x="300" y="420">girar ⅓ y repetir</text>
  <text class="lbl" x="300" y="436">≈1 minuto</text>

  <!-- etiquetas de tiempos -->
  <text class="lbl" x="64" y="548">Invertir ≤5 s por vez · total ≥45 s</text>
  <text class="s" x="64" y="566" font-size="11">No mantener invertido más de 5 s: el agregado puede alojarse en el cuello.</text>

  <!-- PASO 4 -->
  <rect x="464" y="344" width="412" height="238" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="492" cy="372" r="15" fill="#0f766e"/>
  <text class="w" x="488" y="377" font-size="14">4</text>
  <text class="t" x="518" y="377" font-size="14" font-weight="bold">Estabilizar y leer</text>

  <!-- cuello graduado -->
  <rect x="640" y="404" width="66" height="150" rx="6" fill="#e0f2fe" fill-opacity="0.7" stroke="#14304f" stroke-width="2.5"/>
  <rect x="644" y="470" width="58" height="80" fill="#38bdf8" fill-opacity="0.55"/>
  <line x1="640" y1="470" x2="702" y2="470" stroke="#0f766e" stroke-width="3"/>
  <text class="n" x="712" y="474" font-size="12">menisco</text>
  <text class="lbl" x="712" y="492">leer parte inferior</text>
  <text class="lbl" x="712" y="508">al 0.25 %</text>

  <!-- graduaciones -->
  <g stroke="#14304f" stroke-width="1.2">
    <line x1="640" y1="414" x2="656" y2="414"/><line x1="640" y1="426" x2="656" y2="426"/>
    <line x1="640" y1="438" x2="656" y2="438"/><line x1="640" y1="450" x2="656" y2="450"/>
    <line x1="640" y1="462" x2="656" y2="462"/><line x1="640" y1="474" x2="656" y2="474"/>
    <line x1="640" y1="486" x2="656" y2="486"/><line x1="640" y1="498" x2="656" y2="498"/>
    <line x1="640" y1="510" x2="656" y2="510"/><line x1="640" y1="522" x2="656" y2="522"/>
  </g>
  <g class="s" font-size="9.5">
    <text x="624" y="417">9</text><text x="624" y="441">7</text>
    <text x="624" y="465">5</text><text x="624" y="489">3</text>
    <text x="624" y="513">1</text><text x="624" y="526">0</text>
  </g>

  <!-- estabilidad -->
  <rect x="504" y="430" width="112" height="74" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text class="n" x="516" y="450" font-size="11">Estable:</text>
  <text class="lbl" x="516" y="466">≤0.25 % en 2 min</text>
  <text class="lbl" x="516" y="482">Máx. 6 min</text>
  <text class="lbl" x="516" y="498">Espuma ≤2 %</text>

  <!-- pie -->
  <line x1="30" y1="600" x2="870" y2="600" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="s" x="30" y="616" font-size="11">Cálculo: A = AR − C + W. Reportar al 0.25 % más cercano. Si hay fuga, espuma excesiva o concreto intacto, repetir el ensayo.</text>
</svg>
