<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="titulo">
  <title id="titulo">Recipiente de densidad, capas y fórmulas de la ASTM C138</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: #14304f; }
      .s { font-family: Arial, Helvetica, sans-serif; fill: #64748b; }
      .n { font-family: Arial, Helvetica, sans-serif; fill: #0f766e; font-weight: bold; }
      .b { font-family: Arial, Helvetica, sans-serif; fill: #ffffff; font-weight: bold; }
      .f { font-family: "Courier New", monospace; fill: #14304f; font-weight: bold; }
    </style>
  </defs>

  <rect width="800" height="470" fill="#ffffff"/>
  <text class="t" x="32" y="38" font-size="21" font-weight="bold">Densidad y rendimiento — ASTM C138</text>
  <text class="s" x="32" y="62" font-size="13">Recipiente calibrado, compactación según el asentamiento y cálculo de densidad, rendimiento y aire</text>

  <!-- Panel izquierdo -->
  <rect x="28" y="86" width="366" height="344" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t" x="48" y="112" font-size="14" font-weight="bold">Recipiente y capas</text>

  <!-- cilindro -->
  <path d="M 110 130 L 110 350 A 80 18 0 0 0 270 350 L 270 130 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="3"/>
  <ellipse cx="190" cy="130" rx="80" ry="18" fill="#f1f5f9" stroke="#14304f" stroke-width="3"/>
  <!-- concreto -->
  <path d="M 114 140 L 114 348 A 76 15 0 0 0 266 348 L 266 140 Z" fill="#d6d3d1"/>
  <ellipse cx="190" cy="140" rx="76" ry="15" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- capas -->
  <line x1="114" y1="212" x2="266" y2="212" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="114" y1="282" x2="266" y2="282" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="n" x="122" y="206" font-size="11">capa 3</text>
  <text class="n" x="122" y="276" font-size="11">capa 2</text>
  <text class="n" x="122" y="340" font-size="11">capa 1</text>

  <!-- varilla -->
  <rect x="300" y="150" width="7" height="190" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <circle cx="303" cy="340" r="6" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <text class="s" x="286" y="146" font-size="10.5">varilla 16 mm</text>

  <!-- cota -->
  <line x1="88" y1="130" x2="88" y2="350" stroke="#0f766e" stroke-width="2.5" marker-start="url(#f)" marker-end="url(#f)"/>
  <text class="n" x="44" y="246" font-size="11">h</text>

  <rect x="46" y="382" width="330" height="32" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text class="t" x="60" y="403" font-size="11.5" font-weight="bold">Varillado: 3 capas · 25 golpes (≤14 L) · mazo 10–15 golpes</text>

  <!-- Panel derecho -->
  <rect x="414" y="86" width="358" height="344" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t" x="434" y="112" font-size="14" font-weight="bold">Fórmulas</text>

  <rect x="434" y="126" width="318" height="44" rx="8" fill="#ecfdf5" stroke="#0f766e"/>
  <text class="f" x="450" y="146" font-size="13">D = (Mc − Mm) / Vm</text>
  <text class="s" x="450" y="161" font-size="10.5">densidad, kg/m³</text>

  <rect x="434" y="180" width="318" height="44" rx="8" fill="#ecfdf5" stroke="#0f766e"/>
  <text class="f" x="450" y="200" font-size="13">Y = M / D</text>
  <text class="s" x="450" y="215" font-size="10.5">rendimiento, m³</text>

  <rect x="434" y="234" width="318" height="44" rx="8" fill="#ecfdf5" stroke="#0f766e"/>
  <text class="f" x="450" y="254" font-size="13">Ry = Y / Yd</text>
  <text class="s" x="450" y="269" font-size="10.5">rendimiento relativo</text>

  <rect x="434" y="288" width="318" height="44" rx="8" fill="#ecfdf5" stroke="#0f766e"/>
  <text class="f" x="450" y="308" font-size="13">A = [(T − D) / T] × 100</text>
  <text class="s" x="450" y="323" font-size="10.5">aire gravimétrico, %</text>

  <text class="s" x="434" y="356" font-size="11">Mc: molde lleno · Mm: molde vacío</text>
  <text class="s" x="434" y="372" font-size="11">Vm: volumen calibrado · T: densidad teórica</text>
  <text class="s" x="434" y="388" font-size="11">M: masa total · Yd: volumen diseñado</text>

  <rect x="434" y="400" width="318" height="24" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="t" x="446" y="417" font-size="11" font-weight="bold">Capacidad del molde: 6 a 100 L según el NMAS</text>
</svg>
