<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="titulo">
  <title id="titulo">Medidores de aire por presión Tipo A y Tipo B según ASTM C231</title>
  <defs>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: #14304f; }
      .s { font-family: Arial, Helvetica, sans-serif; fill: #64748b; }
      .n { font-family: Arial, Helvetica, sans-serif; fill: #0f766e; font-weight: bold; }
      .b { font-family: Arial, Helvetica, sans-serif; fill: #ffffff; font-weight: bold; }
    </style>
  </defs>

  <rect width="800" height="480" fill="#ffffff"/>
  <text class="t" x="32" y="38" font-size="21" font-weight="bold">Contenido de aire por presión — ASTM C231</text>
  <text class="s" x="32" y="62" font-size="13">Dos diseños basados en la Ley de Boyle: Tipo A (columna de agua) y Tipo B (cámara de aire y manómetro)</text>

  <!-- Tipo A -->
  <rect x="24" y="86" width="370" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t" x="44" y="112" font-size="14" font-weight="bold">Medidor Tipo A</text>

  <!-- cuenco -->
  <path d="M 100 300 L 100 382 A 75 14 0 0 0 250 382 L 250 300 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="2.5"/>
  <ellipse cx="175" cy="300" rx="75" ry="14" fill="#f1f5f9" stroke="#14304f" stroke-width="2.5"/>
  <text class="s" x="128" y="352" font-size="11">cuenco ≥ 6 L</text>

  <!-- tapa -->
  <rect x="96" y="272" width="158" height="28" rx="6" fill="#cbd5e1" stroke="#14304f" stroke-width="2.5"/>

  <!-- columna -->
  <rect x="164" y="128" width="22" height="146" rx="4" fill="#e0f2fe" stroke="#14304f" stroke-width="2.5"/>
  <rect x="168" y="178" width="14" height="92" fill="#38bdf8"/>
  <line x1="158" y1="178" x2="192" y2="178" stroke="#0f766e" stroke-width="2"/>
  <text class="n" x="198" y="182" font-size="11">cero</text>
  <text class="s" x="198" y="150" font-size="10.5">columna</text>
  <text class="s" x="198" y="163" font-size="10.5">graduada</text>

  <!-- bomba -->
  <path d="M 262 250 L 292 250" stroke="#475569" stroke-width="3"/>
  <circle cx="314" cy="250" r="20" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5"/>
  <text class="s" x="292" y="286" font-size="10.5">bomba</text>

  <!-- manómetro -->
  <circle cx="314" cy="190" r="20" fill="#ffffff" stroke="#14304f" stroke-width="2.5"/>
  <line x1="314" y1="190" x2="326" y2="178" stroke="#ef4444" stroke-width="2.5"/>
  <text class="s" x="292" y="164" font-size="10.5">presión P</text>

  <!-- Tipo B -->
  <rect x="410" y="86" width="366" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t" x="430" y="112" font-size="14" font-weight="bold">Medidor Tipo B</text>

  <!-- cuenco -->
  <path d="M 478 306 L 478 386 A 72 14 0 0 0 622 386 L 622 306 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="2.5"/>
  <ellipse cx="550" cy="306" rx="72" ry="14" fill="#f1f5f9" stroke="#14304f" stroke-width="2.5"/>
  <text class="s" x="504" y="356" font-size="11">cuenco ≥ 6 L</text>

  <!-- tapa -->
  <rect x="474" y="278" width="152" height="28" rx="6" fill="#cbd5e1" stroke="#14304f" stroke-width="2.5"/>

  <!-- cámara de aire -->
  <rect x="500" y="170" width="100" height="108" rx="10" fill="#dbeafe" stroke="#14304f" stroke-width="2.5"/>
  <text class="s" x="512" y="222" font-size="10.5">cámara de</text>
  <text class="s" x="512" y="235" font-size="10.5">aire</text>

  <!-- manómetro -->
  <circle cx="632" cy="196" r="30" fill="#ffffff" stroke="#14304f" stroke-width="2.5"/>
  <line x1="632" y1="196" x2="650" y2="178" stroke="#ef4444" stroke-width="2.5"/>
  <text class="s" x="614" y="242" font-size="10.5">dial % aire</text>

  <!-- bomba -->
  <path d="M 550 170 L 550 142" stroke="#475569" stroke-width="3"/>
  <circle cx="550" cy="126" r="16" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5"/>
  <text class="s" x="570" y="130" font-size="10.5">bomba</text>

  <!-- válvulas -->
  <rect x="462" y="290" width="14" height="8" rx="2" fill="#0f766e"/>
  <rect x="624" y="290" width="14" height="8" rx="2" fill="#0f766e"/>
  <text class="s" x="438" y="280" font-size="10.5">válvula</text>

  <!-- pie -->
  <text class="s" x="32" y="474" font-size="11">Presión de trabajo habitual: 50 a 205 kPa (7.5 a 30 psi). Calibración final cada 3 meses como máximo.</text>
</svg>
