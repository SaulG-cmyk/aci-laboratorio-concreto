<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="titulo">
  <title id="titulo">Esquema general del programa ACI Grado I: de la muestra a los especímenes de resistencia</title>
  <defs>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: #14304f; }
      .s { font-family: Arial, Helvetica, sans-serif; fill: #475569; }
      .n { font-family: Arial, Helvetica, sans-serif; fill: #0f766e; font-weight: bold; }
      .w { font-family: Arial, Helvetica, sans-serif; fill: #ffffff; font-weight: bold; }
      .lbl { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; font-size: 11.5px; }
    </style>
    <marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>
  <text class="t" x="30" y="38" font-size="22" font-weight="bold">Del camión al laboratorio</text>
  <text class="s" x="30" y="62" font-size="13">Cadena de validez del programa ACI Grado I: cada etapa depende de la anterior</text>

  <!-- ETAPA 1 -->
  <rect x="30" y="96" width="150" height="150" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <circle cx="58" cy="124" r="15" fill="#0f766e"/>
  <text class="w" x="54" y="129" font-size="13">1</text>
  <text class="t" x="82" y="129" font-size="13" font-weight="bold">Muestreo</text>
  <text class="s" x="48" y="158" font-size="10.5">C172</text>
  <path d="M 78 178 L 78 214 L 132 214 L 132 178 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="2"/>
  <ellipse cx="105" cy="178" rx="27" ry="6" fill="#f1f5f9" stroke="#14304f" stroke-width="2"/>
  <text class="lbl" x="56" y="234" font-size="10">muestra compuesta</text>

  <!-- ETAPA 2 -->
  <rect x="210" y="96" width="150" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="238" cy="124" r="15" fill="#0f766e"/>
  <text class="w" x="234" y="129" font-size="13">2</text>
  <text class="t" x="262" y="129" font-size="13" font-weight="bold">Ensayos frescos</text>
  <text class="s" x="228" y="158" font-size="10.5">C1064 · C143 · C231/C173</text>
  <!-- termómetro -->
  <rect x="250" y="174" width="10" height="46" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="255" cy="224" r="9" fill="#ef4444"/>
  <!-- cono -->
  <path d="M 292 218 L 306 176 L 320 218 Z" fill="#dbeafe" stroke="#14304f" stroke-width="1.5"/>
  <text class="lbl" x="228" y="240" font-size="10">temp. · slump · aire</text>

  <!-- ETAPA 3 -->
  <rect x="390" y="96" width="150" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="418" cy="124" r="15" fill="#0f766e"/>
  <text class="w" x="414" y="129" font-size="13">3</text>
  <text class="t" x="442" y="129" font-size="13" font-weight="bold">Densidad</text>
  <text class="s" x="408" y="158" font-size="10.5">C138</text>
  <!-- recipiente -->
  <path d="M 436 186 L 436 224 A 26 6 0 0 0 488 224 L 488 186 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="2"/>
  <ellipse cx="462" cy="186" rx="26" ry="6" fill="#f1f5f9" stroke="#14304f" stroke-width="2"/>
  <text class="lbl" x="404" y="240" font-size="10">masa · volumen · rendimiento</text>

  <!-- ETAPA 4 -->
  <rect x="570" y="96" width="150" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="598" cy="124" r="15" fill="#0f766e"/>
  <text class="w" x="594" y="129" font-size="13">4</text>
  <text class="t" x="622" y="129" font-size="13" font-weight="bold">Especímenes</text>
  <text class="s" x="588" y="158" font-size="10.5">C31</text>
  <!-- cilindro -->
  <path d="M 600 186 L 600 226 A 22 5 0 0 0 644 226 L 644 186 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="2"/>
  <ellipse cx="622" cy="186" rx="22" ry="5" fill="#f1f5f9" stroke="#14304f" stroke-width="2"/>
  <!-- viga -->
  <path d="M 654 206 L 690 206 L 696 200 L 660 200 Z" fill="#dbeafe" stroke="#14304f" stroke-width="1.5"/>
  <path d="M 654 206 L 654 224 L 690 224 L 690 206 Z" fill="#e2e8f0" stroke="#14304f" stroke-width="1.5"/>
  <text class="lbl" x="584" y="240" font-size="10">moldeo · identificación</text>

  <!-- ETAPA 5 -->
  <rect x="750" y="96" width="120" height="150" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <circle cx="778" cy="124" r="15" fill="#0f766e"/>
  <text class="w" x="774" y="129" font-size="13">5</text>
  <text class="t" x="802" y="129" font-size="13" font-weight="bold">Curado</text>
  <text class="s" x="768" y="158" font-size="10.5">C31</text>
  <!-- gota -->
  <path d="M 810 186 q 16 24 0 34 q -16 -10 0 -34" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  <text class="lbl" x="766" y="240" font-size="10">23 ± 2 °C · cal</text>

  <!-- flechas -->
  <g stroke="#0f766e" stroke-width="2.5" marker-end="url(#f)">
    <line x1="180" y1="171" x2="208" y2="171"/>
    <line x1="360" y1="171" x2="388" y2="171"/>
    <line x1="540" y1="171" x2="568" y2="171"/>
    <line x1="720" y1="171" x2="748" y2="171"/>
  </g>

  <!-- RESULTADO -->
  <rect x="210" y="278" width="480" height="70" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text class="t" x="330" y="306" font-size="14" font-weight="bold">Resultado confiable y trazable</text>
  <text class="s" x="286" y="328" font-size="11">muestra representativa + ensayo oportuno + curado normalizado + registro completo</text>

  <!-- SECCIONES -->
  <text class="t" x="30" y="392" font-size="14" font-weight="bold">Las siete prácticas del programa</text>

  <g>
    <rect x="30" y="408" width="112" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="n" x="40" y="426" font-size="10">01</text>
    <text class="lbl" x="40" y="442" font-size="10.5">Muestreo C172</text>
  </g>
  <g>
    <rect x="152" y="408" width="112" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="n" x="162" y="426" font-size="10">02</text>
    <text class="lbl" x="162" y="442" font-size="10.5">Temperatura C1064</text>
  </g>
  <g>
    <rect x="274" y="408" width="112" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="n" x="284" y="426" font-size="10">03</text>
    <text class="lbl" x="284" y="442" font-size="10.5">Asentamiento C143</text>
  </g>
  <g>
    <rect x="396" y="408" width="112" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="n" x="406" y="426" font-size="10">04</text>
    <text class="lbl" x="406" y="442" font-size="10.5">Densidad C138</text>
  </g>
  <g>
    <rect x="518" y="408" width="112" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="n" x="528" y="426" font-size="10">05</text>
    <text class="lbl" x="528" y="442" font-size="10.5">Aire C231</text>
  </g>
  <g>
    <rect x="640" y="408" width="112" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="n" x="650" y="426" font-size="10">06</text>
    <text class="lbl" x="650" y="442" font-size="10.5">Aire C173</text>
  </g>
  <g>
    <rect x="762" y="408" width="108" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="n" x="772" y="426" font-size="10">07</text>
    <text class="lbl" x="772" y="442" font-size="10.5">Cilindros C31</text>
  </g>

  <text class="s" x="30" y="488" font-size="11">Regla de oro: una muestra mal tomada produce un resultado exacto pero inútil.</text>
</svg>
